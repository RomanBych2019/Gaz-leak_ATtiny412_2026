[platformio]
default_envs = attiny412

[env]
platform = atmelmegaavr
board = ATtiny412
framework = arduino

upload_protocol = serialupdi

board_build.f_cpu = 10000000UL

monitor_speed = 2400
monitor_port = /dev/cu.usbserial-3

upload_speed = 19200
upload_port = /dev/cu.usbserial-3

[env:attiny412]

[env:attiny412_lin]
build_flags =
  -D LIN_DRIVER
